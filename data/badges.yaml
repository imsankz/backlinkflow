# BacklinkFlow — Badge Registry
# Directories that require (or reward) displaying a badge on your site.
# Badges open high-DR directories and jump submission queues.
#
# Fields:
#   name:        Directory name (matches data/directories.yaml)
#   badgeUrl:    URL of the badge image to embed
#   href:        Where the badge links (usually the directory listing/submit page)
#   alt:         Alt text
#   width:       Display width in px (badges are usually wide/short)
#   height:      Display height in px
#   dr:          Domain rating (for sorting)
#   required:    true = directory requires the badge for acceptance
#   notes:       Extra info

- name: Product Hunt
  badgeUrl: https://api.producthunt.com/widgets/embed-image/v1/featured.svg
  href: https://www.producthunt.com/
  alt: Featured on Product Hunt
  width: 250
  height: 54
  dr: 91
  required: false
  notes: Standard launch badge widget

